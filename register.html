<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7fb;
    color: #10213b;
    min-height: 100vh;
}


/* HEADER */

.header {
    background: #061a3b;
    color: white;
    padding: 18px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo-main {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: 1px;
}

.logo-main span {
    color: #10b8c3;
}

.logo-sub {
    color: #65d7df;
    font-size: 10px;
    letter-spacing: 4px;
}

.home-link {
    color: white;
    text-decoration: none;
    font-size: 13px;
}

.home-link:hover {
    color: #65d7df;
}


/* MAIN */

.register-container {
    min-height: calc(100vh - 75px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
}

.register-card {
    width: 100%;
    max-width: 600px;
    background: white;
    border: 1px solid #dce3ed;
    border-radius: 12px;
    padding: 40px;
    box-shadow: 0 15px 40px rgba(0,0,0,.08);
}


/* TITLE */

.register-title {
    text-align: center;
    margin-bottom: 30px;
}

.register-title h1 {
    font-family: Georgia, serif;
    font-size: 30px;
    margin-bottom: 8px;
}

.register-title p {
    color: #65748a;
    font-size: 13px;
}


/* SOCIAL LOGIN */

.social-login {
    display: grid;
    gap: 12px;
    margin-bottom: 25px;
}

.social-btn {
    width: 100%;
    padding: 13px;
    border-radius: 7px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    background: white;
}

.orcid-btn {
    border: 1px solid #a6ce39;
    color: #4d6500;
}

.orcid-btn:hover {
    background: #f5f9e9;
}

.google-btn {
    border: 1px solid #d5dbe3;
    color: #333;
}

.google-btn:hover {
    background: #f7f7f7;
}

.orcid-icon {
    display: inline-block;
    background: #a6ce39;
    color: white;
    border-radius: 50%;
    padding: 2px 5px;
    margin-right: 8px;
    font-size: 11px;
}

.google-icon {
    margin-right: 8px;
    font-weight: 900;
}


/* DIVIDER */

.divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 25px 0;
    color: #8a98aa;
    font-size: 10px;
}

.divider::before,
.divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #dce3ed;
}


/* FORM */

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 7px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd6e2;
    border-radius: 7px;
    font-size: 14px;
    outline: none;
}

.form-group input:focus,
.form-group select:focus {
    border-color: #10aeb9;
}


/* PASSWORD */

.password-note {
    color: #7b899c;
    font-size: 11px;
    margin-top: 5px;
}


/* TERMS */

.terms {
    display: flex;
    gap: 9px;
    align-items: flex-start;
    margin: 20px 0;
    font-size: 12px;
    color: #53637a;
}

.terms input {
    margin-top: 4px;
}

.terms a {
    color: #078b95;
    font-weight: bold;
}


/* BUTTON */

.register-btn {
    width: 100%;
    border: none;
    background: #09254c;
    color: white;
    padding: 14px;
    border-radius: 7px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.register-btn:hover {
    background: #10aeb9;
}


/* LOGIN */

.login-link {
    text-align: center;
    margin-top: 25px;
    font-size: 13px;
    color: #65748a;
}

.login-link a {
    color: #078b95;
    font-weight: bold;
    text-decoration: none;
}


/* FOOTER */

.footer {
    text-align: center;
    padding: 20px;
    color: #8a98aa;
    font-size: 11px;
}


/* MOBILE */

@media(max-width:600px) {

    .header {
        padding: 15px 5%;
    }

        padding: 25px 15px;
    }

    .register-card {
        padding: 28px 22px;
    }

    .form-row {
        grid-template-columns: 1fr;
        gap: 0;
    }

}

<script>

/* =========================
   EMAIL REGISTRATION
========================= */

document.getElementById("registerForm").addEventListener("submit", function(event) {

    event.preventDefault();

    /* GET FORM VALUES */

    const firstName =
        document.getElementById("firstName").value.trim();

    const lastName =
        document.getElementById("lastName").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const institution =
        document.getElementById("institution").value.trim();

    const country =
        document.getElementById("country").value;

    const orcid =
        document.getElementById("orcid").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const terms =
        document.getElementById("terms").checked;


    /* =========================
       VALIDATION
    ========================= */

    if (password.length < 8) {

        alert("Password must contain at least 8 characters.");

        return;
    }


    if (password !== confirmPassword) {

        alert("Passwords do not match.");

        return;
    }


    if (!terms) {

        alert("Please accept the Terms of Use and Privacy Policy.");

        return;
    }


    /* =========================
       CHECK EXISTING ACCOUNT
    ========================= */

    const existingAuthor =
        localStorage.getItem("scopusixteenAuthor");

    if (existingAuthor) {

        const oldAccount =
            JSON.parse(existingAuthor);

        if (
            oldAccount.email.toLowerCase()
            === email.toLowerCase()
        ) {

            alert(
                "An account with this email already exists. Please login."
            );

            window.location.href = "login.html";

            return;
        }
    }


    /* =========================
       CREATE AUTHOR ACCOUNT
    ========================= */

    const author = {

        firstName: firstName,

        lastName: lastName,

        fullName:
            firstName + " " + lastName,

        email: email,

        institution: institution,

        country: country,

        orcid: orcid,

        /* 
           This is only for this front-end MVP.
           For a real production website,
           passwords must be handled by a secure
           server/database and never stored like this.
        */

        password: password,

        registeredAt:
            new Date().toISOString()

    };


    /* SAVE ACCOUNT */

    localStorage.setItem(
        "scopusixteenAuthor",
        JSON.stringify(author)
    );


    /* =========================
       LOGIN AUTHOR
    ========================= */

    localStorage.setItem(
        "scopusixteenLoggedIn",
        "true"
    );


    /* =========================
       SUCCESS MESSAGE
    ========================= */

    alert(
        "Registration successful! Welcome to Scopusixteen Publishing."
    );


    /* =========================
       GO TO SUBMIT MANUSCRIPT
    ========================= */

    window.location.href =
        "submit-manuscript.html";

});


/* =========================
   ORCID
========================= */

function registerWithORCID() {

    alert(
        "ORCID registration will be connected when ORCID OAuth/API is configured."
    );

}


/* =========================
   GOOGLE
========================= */

function registerWithGoogle() {

    alert(
        "Google registration will be connected when Google OAuth is configured."
    );

}

</script>
